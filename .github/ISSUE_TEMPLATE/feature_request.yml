name: Suggest a feature
description: An idea that would make Bearcorder better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like Bearcorder to do, and what it would help you with.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bearcorder version and macOS version, if it matters.
      render: text
