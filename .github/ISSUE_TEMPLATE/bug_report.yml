name: Report a problem
description: Something in Bearcorder does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The quickest way is **Report a problem** in Bearcorder's menu: it fills in the version, macOS and logs for you.
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead. Screenshots and clips help a lot.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bearcorder version, macOS version and Mac model.
      render: text
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash or error
      description: Filled in by Bearcorder when it quit unexpectedly or hit an error.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The last lines of ~/Library/Logs/Bearcorder/Bearcorder.log. Drag the zip Bearcorder made into this issue for the full logs.
      render: text
