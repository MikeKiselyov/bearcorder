# Pull requests: a new release in the notes, unit tests and the media self-test.
# Merges to main: the same tests, then a GitHub release and a v<version> tag from the notes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; only the release job can write (tags and releases).
permissions:
  contents: read

# A newer push to a pull request cancels its older run; every merge to main runs to the end and releases.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  release-notes:
    name: New release in the notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check/release.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same shellcheck as on the Mac (brew): older ones read the directives differently.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - run: shellcheck -x scripts/*.sh scripts/*/*.sh scripts/*/*/*.sh
      # actionlint runs the shellcheck above on every run: block of the workflows too.
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          actionlint -version
      - run: actionlint -no-color

  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Swift version
        id: swift
        run: |
          swift --version
          echo "version=$(swift --version 2>&1 | head -1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # Compiled packages and objects, so a run rebuilds only what changed. A pull request reads the
      # cache of main and saves its own; the cache is not trusted for anything but build output.
      - name: Cache .build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          # The repository name is in the key: the build output holds absolute paths, and a cache
          # saved before a rename fails to compile in the new checkout folder.
          key: spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ github.event.repository.name }}-${{ steps.swift.outputs.version }}-
      - name: Unit tests
        run: swift test --parallel --enable-code-coverage
      # Information only, no threshold. A failing report does not fail the job.
      - name: Coverage of AppCore
        continue-on-error: true
        run: |
          codecov_dir="$(dirname "$(swift test --show-codecov-path)")"
          test_binary=".build/debug/AppPackageTests.xctest/Contents/MacOS/AppPackageTests"
          {
            echo "### Coverage of Sources/AppCore"
            echo '```'
            if [ -f "$test_binary" ]; then
              xcrun llvm-cov report "$test_binary" -instr-profile "$codecov_dir/default.profdata" -ignore-filename-regex='(/Tests/|/\.build/|/Sources/App/)' -use-color=false || true
            else
              echo "no coverage report: $test_binary not found"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Self-test (export, edits, annotations, OCR, QR, stitching)
        run: |
          swift build
          mkdir -p build/self-test
          .build/debug/App --self-test build/self-test
      - name: Every control has a check
        run: python3 -I scripts/check/control-coverage.py
      - name: A release has no automation
        run: scripts/check/no-automation.sh
      - name: The app bundle (resources, Info.plist, signature)
        env:
          APP_SIGN_IDENTITY: "-"
        run: |
          scripts/build-app.sh
          source scripts/lib/app-name.sh
          app="build/$APP_NAME.app"
          test -f "$app/Contents/Resources/App_App.bundle/en.lproj/menubar.strings"
          test -d "$app/Contents/Resources/App_App.bundle/WhatsNew"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$("$app/Contents/MacOS/$APP_NAME" --version)"
          codesign --verify --strict "$app"
      - name: Self-test pictures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: self-test
          path: build/self-test

  # Apart from the tests, so the build and test steps never hold a token that can write.
  release:
    name: Release
    if: github.event_name == 'push'
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: swift build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(.build/debug/App --version)
          if git rev-parse --verify --quiet "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            exit 0
          fi
          mkdir -p build
          .build/debug/App --release-notes > build/release-notes.md
          source scripts/lib/app-name.sh
          gh release create "v$version" --target "$GITHUB_SHA" --title "$APP_NAME $version" --notes-file build/release-notes.md
